// ─── FISH DATA ────────────────────────────────────────────────────────────────
// Story: real +3 treatment effect within each sex, masked by sex imbalance
// under simple randomization and revealed by stratified randomization.
//
// Simple randomization (3M+7F → Treatment):
//   Treatment {1,2,3,11,12,13,14,15,16,17}  median = 5.5
//   Control   {4,5,6,7,8,9,10,18,19,20}     median = 5.0  → apparent null
//
// Stratified randomization (5M+5F each):
//   Treatment {1,2,3,8,9,11,12,13,14,15}    median = 7.0
//   Control   {4,5,6,7,10,16,17,18,19,20}   median = 4.0  → +3 effect visible
//
// Size: Sex×Size gives 4 perfectly even strata (M·L=6, M·S=4, F·L=4, F·S=6)

const FISH = [
  { id:  1, sex: 'M', size: 'L', family: 'A', speed: 'fast', score: 9 },
  { id:  2, sex: 'M', size: 'L', family: 'A', speed: 'fast', score: 8 },

  { id:  7, sex: 'M', size: 'L', family: 'D', speed: 'fast', score: 6 },
  { id:  8, sex: 'M', size: 'S', family: 'D', speed: 'slow', score: 8 },
  { id:  9, sex: 'M', size: 'S', family: 'A', speed: 'slow', score: 8 },
  { id: 10, sex: 'M', size: 'L', family: 'B', speed: 'slow', score: 5 },
  { id: 11, sex: 'F', size: 'S', family: 'A', speed: 'slow', score: 5 },
  { id: 12, sex: 'F', size: 'S', family: 'A', speed: 'fast', score: 4 },
  { id: 13, sex: 'F', size: 'L', family: 'B', speed: 'slow', score: 6 },
  { id: 14, sex: 'F', size: 'S', family: 'B', speed: 'slow', score: 4 },
  { id: 15, sex: 'F', size: 'L', family: 'C', speed: 'fast', score: 6 },

  { id: 18, sex: 'F', size: 'S', family: 'D', speed: 'slow', score: 2 },
  { id: 19, sex: 'F', size: 'L', family: 'A', speed: 'fast', score: 3 },
  { id: 20, sex: 'F', size: 'S', family: 'C', speed: 'slow', score: 2 },
];

const SIMPLE_TRT_IDS = new Set([1, 2, 3, 11, 12, 13, 14, 15, 16, 17]);
const STRAT_TRT_IDS  = new Set([1, 2, 3, 8, 9, 11, 12, 13, 14, 15]);

// ─── CATCH SEQUENCES ─────────────────────────────────────────────────────────
// These represent the pre-generated random assignment plans shown before
// any fish are caught. The catch order is the order fish emerge from the tank.
// Assignment (T/C) is derived from the catch order + the target group sets.

// Screen 1 — communal tank, 20 fish
// Catch order designed so that T/C sequence is non-trivially interleaved
// and the sex composition of each group only becomes clear as fish are caught.
const SIMPLE_CATCH_ORDER = [5, 11, 2, 18, 1, 7, 14, 9, 16, 3, 20, 6, 13, 4, 15, 8, 19, 10, 17, 12];
const SIMPLE_SEQ = SIMPLE_CATCH_ORDER.map(id => SIMPLE_TRT_IDS.has(id) ? 'T' : 'C');
// → [C,T,T,C,T,C,T,C,T,T,C,C,T,C,T,C,C,C,T,T]  (10T, 10C)

// Screen 2 — male tank, 10 fish
// Catch order interleaves C and T fish; sequence alternates C,T,C,T... (fixed allocation)
const MALE_CATCH_ORDER = [4, 1, 5, 2, 6, 3, 7, 8, 10, 9];
const MALE_SEQ = MALE_CATCH_ORDER.map(id => STRAT_TRT_IDS.has(id) ? 'T' : 'C');
// → [C,T,C,T,C,T,C,T,C,T]  (5T, 5C — alternating fixed allocation)

// Screen 2 — female tank, 10 fish
const FEM_CATCH_ORDER = [16, 11, 17, 12, 18, 13, 19, 14, 20, 15];
const FEM_SEQ = FEM_CATCH_ORDER.map(id => STRAT_TRT_IDS.has(id) ? 'T' : 'C');
// → [C,T,C,T,C,T,C,T,C,T]  (5T, 5C — alternating fixed allocation)

// Stable per-fish x-jitter for strip chart (prevents dot overlap)
const JX = {
   1: -13,  2:   7,  3:  -3,  4:  11,  5:  -7,
   6:  15,  7:  -5,  8:   3,  9: -11, 10:   5,
  11:  -9, 12:   9, 13: -15, 14:   1, 15:  -1,
  16:  13, 17:  -7, 18:   7, 19: -13, 20:   9,
};

// ─── DERIVED ARRAYS ───────────────────────────────────────────────────────────

const byId     = id => FISH.find(f => f.id === id);
const MALES    = FISH.filter(f => f.sex === 'M');
const FEMALES  = FISH.filter(f => f.sex === 'F');

// Build final group arrays from sequences for chart use
const SIMPLE_TRT_FISH = SIMPLE_CATCH_ORDER
  .map((id, i) => ({ fish: byId(id), grp: SIMPLE_SEQ[i] }))
  .filter(x => x.grp === 'T').map(x => x.fish);
const SIMPLE_CTL_FISH = SIMPLE_CATCH_ORDER
  .map((id, i) => ({ fish: byId(id), grp: SIMPLE_SEQ[i] }))
  .filter(x => x.grp === 'C').map(x => x.fish);

const STRAT_TRT_FISH = FISH.filter(f =>  STRAT_TRT_IDS.has(f.id));
const STRAT_CTL_FISH = FISH.filter(f => !STRAT_TRT_IDS.has(f.id));

// Per-sex subsets for the two-chart layout on Screen 2
const STRAT_MALE_TRT = STRAT_TRT_FISH.filter(f => f.sex === 'M');
const STRAT_MALE_CTL = STRAT_CTL_FISH.filter(f => f.sex === 'M');
const STRAT_FEM_TRT  = STRAT_TRT_FISH.filter(f => f.sex === 'F');
const STRAT_FEM_CTL  = STRAT_CTL_FISH.filter(f => f.sex === 'F');

// ─── HELPER FUNCTIONS ─────────────────────────────────────────────────────────

function countSex(arr) {
  return { m: arr.filter(f => f.sex === 'M').length, f: arr.filter(f => f.sex === 'F').length };
}

function calcMean(arr) {
  if (!arr.length) return 0;
  return arr.reduce((sum, f) => sum + f.score, 0) / arr.length;
}

// Full Cartesian product including empty strata
const VAR_VALUES = {
  sex:    ['Female', 'Male'],
  speed:  ['fast', 'slow'],
  family: ['Family A', 'Family B', 'Family C', 'Family D'],
  size:   ['Large', 'Small'],
};

function getFishVal(fish, key) {
  if (key === 'sex')    return fish.sex === 'M' ? 'Male' : 'Female';
  if (key === 'size')   return fish.size === 'L' ? 'Large' : 'Small';
  if (key === 'family') return `Family ${fish.family}`;
  if (key === 'speed')  return fish.speed;
  return '';
}

function cartProduct(arrays) {
  return arrays.reduce(
    (acc, arr) => acc.flatMap(x => arr.map(y => [...x, y])),
    [[]]
  );
}

function computeStrata(vars) {
  const keys = Object.keys(vars).filter(k => vars[k]);
  if (keys.length === 0) return [];
  return cartProduct(keys.map(k => VAR_VALUES[k]))
    .map(combo => ({
      label: combo.join(' · '),
      fish:  FISH.filter(f => keys.every((k, i) => getFishVal(f, k) === combo[i])),
    }))
    .sort((a, b) => a.label.localeCompare(b.label));
}

function assignWithinStratum(fish) {
  return [...fish]
    .sort((a, b) => a.id - b.id)
    .map((f, i) => ({ ...f, grp: i % 2 === 0 ? 'T' : 'C' }));
}

// SVG tank showing anonymous fish silhouettes. Fish disappear as they're caught.
// fishColor: C.male (green sex tank), C.female (pink sex tank), or null (gray communal tank).

function Tank({ remaining, total, fishColor, label }) {
  const cols = 5;
  const rows = Math.ceil(total / cols);
  const W = 190, padX = 14, padY = 14;
  const H = padY * 2 + rows * 22 + (rows - 1) * 6;
  const cellW = (W - padX * 2) / cols;
  const cellH = (H - padY * 2) / rows;

  // fish color: sex-colored tanks show their color; communal tank shows gray
  const fill   = fishColor || '#9E9E9E';
  const border = fishColor === C.male   ? '#0060BB'
               : fishColor === C.female ? '#CC4400'
               : '#BDBDBD';

  return (
    <div style={{ textAlign: 'center', flexShrink: 0 }}>
      <div style={{ fontSize: '0.78rem', fontWeight: 700, color: C.dark, marginBottom: 4 }}>{label}</div>
      <svg
        viewBox={`0 0 ${W} ${H}`}
        style={{ width: '100%', maxWidth: W, border: `2px solid ${border}`, borderRadius: 8, background: '#E8F4FF', display: 'block', margin: '0 auto' }}
        role="img"
        aria-label={`Tank with ${remaining} fish remaining`}
      >
        {/* Water surface shimmer lines */}
        <line x1="0" y1="6" x2={W} y2="6" stroke="#B3D9FF" strokeWidth="3" opacity="0.6" />
        <line x1="0" y1="11" x2={W} y2="11" stroke="#C8E6FF" strokeWidth="2" opacity="0.4" />

        {/* Fish icons — neutral SVG for communal tank, colored SVGs for sex tanks */}
        {Array.from({ length: remaining }, (_, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const cx  = padX + (col + 0.5) * cellW;
          const cy  = padY + (row + 0.5) * cellH;
          const uri = !fishColor ? FISH_N_URI : fishColor === C.male ? FISH_M_URI : FISH_F_URI;
          const fw  = fishColor === C.female ? 27 : 28;   // 78:31 → 27×11, 74:29 → 28×11
          const fh  = 11;
          return <image key={i} href={uri} x={cx - fw / 2} y={cy - fh / 2} width={fw} height={fh} />;
        })}

        {remaining === 0 && (
          <text x={W / 2} y={H / 2 + 4} textAnchor="middle" fontSize="11" fill="#90A4AE" fontFamily="sans-serif" fontStyle="italic">
            tank empty
          </text>
        )}
      </svg>
      <div style={{ fontSize: '0.72rem', color: C.gray, marginTop: 4 }}>
        {remaining} of {total} remaining
      </div>
    </div>
  );
}

// ─── SEQUENCE SLOT ────────────────────────────────────────────────────────────
// One assignment slot in the pre-generated sequence.
// Empty: shows the T or C label (purple or dark). Filled: shows caught fish.

function SeqSlot({ index, assignment, fish }) {
  const aColor = assignment === 'T' ? C.trt : C.ctl;
  const imgW   = 36;

  return (
    <div style={{
      width: 58, minHeight: fish ? 98 : 68,
      border: `2px solid ${aColor}`, borderRadius: 8, padding: '4px 3px',
      background: C.card, display: 'flex', flexDirection: 'column',
      alignItems: 'center', flexShrink: 0,
      transition: 'min-height 0.2s ease',
    }}>
      <div style={{ fontSize: '0.58rem', color: C.gray, lineHeight: 1.2 }}>#{index + 1}</div>
      <div style={{ fontSize: '1rem', fontWeight: 800, color: aColor, lineHeight: 1.2 }}>{assignment}</div>
      {fish ? (
        <>
          <img
            src={fish.sex === 'M' ? FISH_M_URI : FISH_F_URI}
            width={imgW}
            height={fish.sex === 'M' ? Math.round(imgW * 29 / 74) : Math.round(imgW * 31 / 78)}
            alt={fish.sex === 'M' ? '♂' : '♀'}
            style={{ display: 'block', marginTop: 3 }}
          />
          <div style={{ fontSize: '0.6rem', fontWeight: 700, color: fish.sex === 'M' ? C.maleTxt : C.femTxt, lineHeight: 1.2 }}>
            {fish.sex === 'M' ? '♂' : '♀'}
          </div>
          <div style={{ fontSize: '0.58rem', fontWeight: 700, color: C.black }}>#{fish.id}</div>
        </>
      ) : (
        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ width: 26, height: 26, borderRadius: '50%', border: `1.5px dashed ${aColor}`, opacity: 0.3 }} />
        </div>
      )}
    </div>
  );
}

// ─── SEQUENCE GRID ────────────────────────────────────────────────────────────
// Wrapping grid of SeqSlot cards. Slots wrap after 10 per row.

function SeqGrid({ catchOrder, sequence, caughtCount, sectionLabel }) {
  return (
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: '0.78rem', fontWeight: 700, color: C.dark, marginBottom: 6 }}>
        {sectionLabel}
      </div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
        {sequence.map((assignment, i) => (
          <SeqSlot
            key={i}
            index={i}
            assignment={assignment}
            fish={i < caughtCount ? byId(catchOrder[i]) : null}
          />
        ))}
      </div>
    </div>
  );
}

// ─── STRIP CHART ──────────────────────────────────────────────────────────────
// Male: solid lime-green filled circle.
// Female: hollow magenta circle (open, stroke only) — multimodal sex encoding.
// T = purple slots, C = dark gray slots — consistent with sequence slot colors.

// neutral=true: all dots one color, no sex counts, no sex legend — used for Reveal 1
// title: optional heading above chart — used for per-sex charts on Screen 2
// svgMaxWidth: controls SVG maxWidth (default 420) — set smaller for side-by-side layout
// hideSexCounts: hides the ♂/♀ count labels below group names — used for per-sex charts
function StripChart({ trt, ctl, neutral = false, title, svgMaxWidth = 420, hideSexCounts = false, hideLegend = false, hideMedianLegend = false }) {
  const W = 380, H = 280, Ml = 52, Mt = 24, Mr = 24, Mb = 56;
  const pw = W - Ml - Mr, ph = H - Mt - Mb;
  const ctlX = Ml + pw * 0.28, trtX = Ml + pw * 0.72;
  const yS   = v => Mt + (10 - v) / 10 * ph;
  const ticks = [0, 2, 4, 6, 8, 10];
  const groups = [
    { fish: ctl, gx: ctlX, label: 'Control',   med: calcMean(ctl), col: C.ctl },
    { fish: trt, gx: trtX, label: 'Treatment', med: calcMean(trt), col: C.trt },
  ];

  return (
    <div>
      {title && (
        <div style={{ fontWeight: 700, fontSize: '1rem', color: C.black, marginBottom: 6, textAlign: 'center' }}>
          {title}
        </div>
      )}
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', maxWidth: svgMaxWidth }}
        role="img" aria-label={neutral ? "Strip chart of aggression scores" : "Strip chart of aggression scores. Male: filled blue circles. Female: hollow orange circles."}>
        {ticks.map(v => (
          <g key={v}>
            <line x1={Ml} y1={yS(v)} x2={W - Mr} y2={yS(v)} stroke={C.border} strokeDasharray="3,2" />
            <text x={Ml - 6} y={yS(v) + 4} textAnchor="end" fontFamily="'JetBrains Mono',monospace" fontSize="12" fill={C.dark}>{v}</text>
          </g>
        ))}
        <text x={13} y={Mt + ph / 2} textAnchor="middle" fontFamily="'JetBrains Mono',monospace" fontSize="12" fill={C.dark} transform={`rotate(-90,13,${Mt + ph / 2})`}>
          Aggression Score
        </text>
        {groups.map(({ fish, gx, label, med, col }) => {
          const sc = countSex(fish);
          return (
            <g key={label}>
              {fish.map(f => {
                const cx = gx + JX[f.id], cy = yS(f.score);
                if (neutral) {
                  return <circle key={f.id} cx={cx} cy={cy} r="5.5" fill={C.mid} opacity="0.85" />;
                }
                return f.sex === 'M'
                  ? <circle key={f.id} cx={cx} cy={cy} r="5.5" fill={C.male} opacity="0.92" />
                  : <circle key={f.id} cx={cx} cy={cy} r="5.5" fill="none" stroke={C.female} strokeWidth="2.2" />;
              })}
              {/* Mean bar — colored by group (T=purple, C=dark) */}
              <line x1={gx - 22} y1={yS(med)} x2={gx + 22} y2={yS(med)} stroke={col} strokeWidth="3" strokeLinecap="round" />
              <text x={gx + 27} y={yS(med) + 4} fontFamily="'JetBrains Mono',monospace" fontSize="11" fontWeight="bold" fill={col}>{med.toFixed(1)}</text>
              <text x={gx} y={H - Mb + 18} textAnchor="middle" fontFamily="'JetBrains Mono',monospace" fontSize="12" fontWeight="600" fill={col}>{label}</text>
              {!neutral && !hideSexCounts && (
                <text x={gx} y={H - Mb + 34} textAnchor="middle" fontFamily="'JetBrains Mono',monospace" fontSize="11" fill={C.gray}>{sc.m}♂ {sc.f}♀</text>
              )}
            </g>
          );
        })}
      </svg>
      {/* Legend */}
      {!hideLegend && (
      <div style={{ paddingLeft: 8, flexShrink: 0, minWidth: 80 }}>
        {/* Sex symbols — only shown when sex is encoded */}
        {!neutral && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.72rem', fontWeight: 700, color: C.gray, marginBottom: 5 }}>Sex</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 5 }}>
              <svg width="14" height="14"><circle cx="7" cy="7" r="5.5" fill={C.male} /></svg>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.75rem', color: C.dark }}>Male</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <svg width="14" height="14"><circle cx="7" cy="7" r="5.5" fill="none" stroke={C.female} strokeWidth="2" /></svg>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.75rem', color: C.dark }}>Female</span>
            </div>
          </div>
        )}
        {!hideMedianLegend && (
        <div style={{ borderTop: neutral ? 'none' : `1px solid ${C.border}`, paddingTop: neutral ? 0 : 8 }}>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.72rem', fontWeight: 700, color: C.gray, marginBottom: 5 }}>Mean</div>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.72rem', color: C.ctl }}>C: {calcMean(ctl).toFixed(1)}</div>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.72rem', color: C.trt }}>T: {calcMean(trt).toFixed(1)}</div>
        </div>
        )}
      </div>
      )}
    </div>
  </div>
  );
}

// ─── SEX DISTRIBUTION CHART ───────────────────────────────────────────────────
// Grouped bar chart showing M/F counts per group — used in Screen 1 Reveal 2.
// Control: 7M 3F  |  Treatment: 3M 7F

function SexDistChart() {
  const W = 380, H = 220, Ml = 52, Mt = 20, Mr = 24, Mb = 50;
  const pw = W - Ml - Mr, ph = H - Mt - Mb;
  const ctlX = Ml + pw * 0.28, trtX = Ml + pw * 0.72;
  const yMax = 10, ticks = [0, 2, 4, 6, 8, 10];
  const yS = v => Mt + (yMax - v) / yMax * ph;
  const barW = 26, gap = 5;

  const groups = [
    { label: 'Control',   gx: ctlX, col: C.ctl, mCount: 7, fCount: 3 },
    { label: 'Treatment', gx: trtX, col: C.trt, mCount: 3, fCount: 7 },
  ];

  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', maxWidth: 420 }}
        role="img" aria-label="Bar chart showing sex distribution across groups. Control: 7 male, 3 female. Treatment: 3 male, 7 female.">
        {/* Gridlines and y-axis labels */}
        {ticks.map(v => (
          <g key={v}>
            <line x1={Ml} y1={yS(v)} x2={W - Mr} y2={yS(v)} stroke={C.border} strokeDasharray="3,2" />
            <text x={Ml - 6} y={yS(v) + 4} textAnchor="end" fontFamily="'JetBrains Mono',monospace" fontSize="12" fill={C.dark}>{v}</text>
          </g>
        ))}
        {/* Y-axis title */}
        <text x={13} y={Mt + ph / 2} textAnchor="middle" fontFamily="'JetBrains Mono',monospace" fontSize="12" fill={C.dark} transform={`rotate(-90,13,${Mt + ph / 2})`}>
          Count
        </text>
        {/* Bars */}
        {groups.map(({ label, gx, col, mCount, fCount }) => {
          const mX = gx - barW - gap / 2;
          const fX = gx + gap / 2;
          return (
            <g key={label}>
              {/* Male bar */}
              <rect x={mX} y={yS(mCount)} width={barW} height={yS(0) - yS(mCount)} fill={C.male} opacity="0.85" rx="2" />
              <text x={mX + barW / 2} y={yS(mCount) - 5} textAnchor="middle" fontFamily="'JetBrains Mono',monospace" fontSize="11" fontWeight="bold" fill={C.maleTxt}>{mCount}</text>
              {/* Female bar */}
              <rect x={fX} y={yS(fCount)} width={barW} height={yS(0) - yS(fCount)} fill={C.female} opacity="0.85" rx="2" />
              <text x={fX + barW / 2} y={yS(fCount) - 5} textAnchor="middle" fontFamily="'JetBrains Mono',monospace" fontSize="11" fontWeight="bold" fill={C.femTxt}>{fCount}</text>
              {/* Group label */}
              <text x={gx} y={H - Mb + 18} textAnchor="middle" fontFamily="'JetBrains Mono',monospace" fontSize="12" fontWeight="600" fill={col}>{label}</text>
            </g>
          );
        })}
      </svg>
      {/* Legend */}
      <div style={{ paddingLeft: 8, flexShrink: 0, minWidth: 80 }}>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.72rem', fontWeight: 700, color: C.gray, marginBottom: 5 }}>Sex</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 5 }}>
          <div style={{ width: 12, height: 12, borderRadius: 2, background: C.male }} />
          <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.75rem', color: C.dark }}>Male</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <div style={{ width: 12, height: 12, borderRadius: 2, background: C.female }} />
          <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.75rem', color: C.dark }}>Female</span>
        </div>
      </div>
    </div>
  );
}


// ─── RESPONSE DISPLAY ─────────────────────────────────────────────────────────

function ResponseDisplay({ prompt, text }) {

      <div style={{ fontWeight: 600, fontSize: '0.85rem', color: C.gray, marginBottom: 4 }}>{prompt}</div>

// ─── BADGE ────────────────────────────────────────────────────────────────────

function Badge({ text, type = 'info' }) {
  const s = { info: ['#EDE9FE',C.accent,C.accent], success: ['#F0FDF4','#86EFAC','#166534'], warning: ['#FEF3C7','#FCD34D','#92400E'], error: ['#FEE2E2','#FCA5A5','#DC2626'] }[type] || ['#EDE9FE',C.accent,C.accent];
  return (
    <div style={{ background: s[0], border: `1px solid ${s[1]}`, borderRadius: 6, padding: '5px 11px', fontSize: '0.85rem', fontWeight: 600, color: s[2] }}>
      {text}
    </div>

}

// ─── STRATUM TANK ─────────────────────────────────────────────────────────────
// Mini tank for the Screen 3 multi-variable explorer. Each stratum is a
// pre-sorted holding tank. Fish are colored by sex (green/pink) regardless
// of which variables are selected — shows the sex composition of each tank.
// Empty strata render as dry/empty tanks (visually more impactful than a card).

function StratumTank({ label, fish }) {
  const n      = fish.length;
  const cols   = Math.min(Math.max(n, 1), 5);
  const rows   = n > 0 ? Math.ceil(n / cols) : 1;
  const W      = 130;
  const padX   = 10, padY = 10;
  const cellW  = (W - padX * 2) / cols;
  const cellH  = 18;
  const H      = padY * 2 + rows * cellH;

  const assigned = n > 0 ? assignWithinStratum(fish) : [];
  const tCount   = assigned.filter(f => f.grp === 'T').length;
  const cCount   = assigned.filter(f => f.grp === 'C').length;

  const isEmpty = n === 0;
  const isProb  = n === 1;
  const isOdd   = n > 1 && n % 2 === 1;

  const tankBorder = isEmpty || isProb ? '#FCA5A5'
    : isOdd   ? '#FCD34D'
    : '#86EFAC';
  const tankBg = isEmpty ? '#F5F5F5' : '#E8F4FF';

  return (
    <div style={{ width: W, flexShrink: 0 }}>
      {/* Label */}
      <div style={{
        fontSize: '0.65rem', fontWeight: 700, color: C.dark,
        marginBottom: 4, lineHeight: 1.3, wordBreak: 'break-word',
        minHeight: '2.2em',
      }}>
        {label}
      </div>

      {/* Tank SVG */}
      <svg
        viewBox={`0 0 ${W} ${H}`}
        style={{ width: '100%', border: `2px solid ${tankBorder}`, borderRadius: 6, background: tankBg, display: 'block' }}
        role="img"
        aria-label={`${label}: ${n} fish`}
      >
        {!isEmpty && (
          <line x1="0" y1="5" x2={W} y2="5" stroke="#B3D9FF" strokeWidth="3" opacity="0.5" />
        )}
        {fish.map((f, i) => {
          const col  = i % cols;
          const row  = Math.floor(i / cols);
          const cx   = padX + (col + 0.5) * cellW;
          const cy   = padY + (row + 0.5) * cellH;
          const uri  = f.sex === 'M' ? FISH_M_URI : FISH_F_URI;
          const fw   = f.sex === 'M' ? 20 : 19;   // 74:29 → 20×8, 78:31 → 19×8
          const fh   = 8;
          return <image key={f.id} href={uri} x={cx - fw / 2} y={cy - fh / 2} width={fw} height={fh} />;
        })}
        {isEmpty && (
          <text x={W / 2} y={H / 2 + 4} textAnchor="middle" fontSize="9" fill="#BDBDBD" fontFamily="sans-serif" fontStyle="italic">
            empty
          </text>
        )}
      </svg>

      {/* Status line */}
      <div style={{ marginTop: 4, fontSize: '0.62rem', fontWeight: 700, lineHeight: 1.3 }}>
        {isEmpty ? (
          <span style={{ color: '#DC2626' }}>0 fish — can't assign</span>
        ) : isProb ? (
          <span style={{ color: '#DC2626' }}>⚠ 1 fish — can't balance</span>
        ) : isOdd ? (
          <span style={{ color: '#D97706' }}>⚠ {n} fish · <span style={{ color: C.trt }}>T:{tCount}</span> <span style={{ color: C.ctl }}>C:{cCount}</span></span>
        ) : (
          <span style={{ color: '#16A34A' }}>✓ {n} fish · <span style={{ color: C.trt }}>T:{tCount}</span> <span style={{ color: C.ctl }}>C:{cCount}</span></span>
        )}
      </div>
    </div>
  );
}


// ─── MAIN ACTIVITY ────────────────────────────────────────────────────────────

function App() {

  const [s1reveal,  setS1reveal]  = useState(0);

  const [s2results, setS2results] = useState(false);

  // Screen 3: multi-variable explorer and reflection

  const [exQ,    setExQ]    = useState('');
  const [exSub,  setExSub]  = useState(false);

  const goNext = () => screen < TOTAL ? setScreen(s => s + 1) : setScreen('congrats');
  const goPrev = () => screen === 'congrats' ? setScreen(TOTAL) : setScreen(s => Math.max(1, s - 1));

  const canGoNext = screen === 1 ? s1reveal >= 3
    : screen === 2 ? s2results
    : screen === 3 ? exSub

  // Screen 3 strata
  const strata     = useMemo(() => computeStrata(exVars), [exVars]);
  const emptyCount = strata.filter(s => s.fish.length === 0).length;
  const probCount  = strata.filter(s => s.fish.length === 1).length;
  const oddCount   = strata.filter(s => s.fish.length > 1 && s.fish.length % 2 === 1).length;

  // ── CONGRATS ──────────────────────────────────────────────────────────────
  if (screen === 'congrats') {
    return (
      <div style={{ background: C.pageBg, minHeight: '100vh', padding: '0 0 100px' }}>

            You saw how a real treatment effect can be completely hidden when a confounding variable is imbalanced across groups — and how stratified randomization with fixed allocation surfaces effects that would otherwise be invisible.
          </p>
          <p style={{ fontSize: '1rem', fontWeight: 500, color: C.dark, lineHeight: 1.6, maxWidth: 560, margin: '0 auto' }}>
            You also explored the trade-off: each additional stratification variable multiplies the number of subgroups, which can leave some strata too small — or empty — to balance. Good experimental design means stratifying on the variables that matter most.
          </p>

      <div style={{ maxWidth: 800, margin: '0 auto', padding: '24px 16px' }}>

                <div style={{ marginTop: 14 }}>
                  <Btn label="View Study Results" variant="primary" onClick={() => setS1reveal(1)} />
                </div>
              )}
            </div>

            {/* Reveal 1: Neutral strip chart — no sex encoding */}
            {s1reveal >= 1 && (
              <>
                <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '16px 16px 8px', marginBottom: 16 }}>
                  <StripChart trt={SIMPLE_TRT_FISH} ctl={SIMPLE_CTL_FISH} neutral hideMedianLegend />
                </div>
                <InstructionCard accent={C.accent} bg="#F5F0FF" title="No Effect?">
                  It appears there is no effect of treatment on zebrafish aggression. But wait — let's look more closely at the composition of each group.
                </InstructionCard>
                {s1reveal === 1 && (
                  <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 16 }}>
                    <Btn label="Explore Further" variant="primary" onClick={() => setS1reveal(2)} />
                  </div>
                )}
              </>
            )}

            {/* Reveal 2: Sex distribution bar chart — shows the imbalance */}
            {s1reveal >= 2 && (
              <>
                <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '16px 16px 8px', marginBottom: 16 }}>
                  <SexDistChart />
                </div>
                <InstructionCard accent={C.accent} bg="#F5F0FF" title="A Baseline Imbalance">
                  The simple randomization method produced an imbalance! The treatment group ended up with 7 females and only 3 males, while the control group has 7 males and 3 females. If males and females have sex specific differences in aggression behavior, this imbalance could be masking a real treatment effect.
                </InstructionCard>
                {s1reveal === 2 && (
                  <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 16 }}>
                    <Btn label="See What This Means" variant="primary" onClick={() => setS1reveal(3)} />
                  </div>
                )}
              </>
            )}

            {/* Reveal 3: Sex-encoded strip chart — shows sex-score relationship */}
            {s1reveal >= 3 && (
              <>
                <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '16px 16px 8px', marginBottom: 16 }}>
                  <StripChart trt={SIMPLE_TRT_FISH} ctl={SIMPLE_CTL_FISH} hideSexCounts hideMedianLegend />
                </div>
                <InstructionCard accent={C.accent} bg="#F5F0FF" title="Sex Differences">
                  There appears to be a pattern: females cluster at lower aggression scores than males. This means the imbalanced sex distribution may have been responsible for the appearance of a null effect. Unfortunately, we do not have enough fish from each sex in the control and treatment conditions to know for sure. We'll need to stratify group allocation by sex to properly evaluate the treatment.
                </InstructionCard>
              </>
            )}
          </div>
        )}

        {/* ── SCREEN 2: Stratified Randomization ──────────────────────── */}
        {screen === 2 && (
          <div>
            <InstructionCard title="Stratified Randomization by Sex">
              Fish have been <strong>pre-sorted into sex-specific tanks</strong>. Each tank has a fixed allocation with 5 treatment and 5 control slots in a random assignment sequence. Catch fish from each tank to fill both sequences.
            </InstructionCard>

            {/* Male tank section */}
            <div style={{ background: C.card, border: `2px solid ${C.male}30`, borderRadius: 8, padding: 14, marginBottom: 12 }}>
              <div style={{ fontWeight: 700, fontSize: '0.9rem', color: C.maleTxt, marginBottom: 10 }}>
                ♂ Male Tank — {10 - s2mCaught} remaining
              </div>
              <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start', flexWrap: 'wrap' }}>
                <Tank remaining={10 - s2mCaught} total={10} fishColor={C.male} label="Male Tank" />
                <SeqGrid
                  catchOrder={MALE_CATCH_ORDER}
                  sequence={MALE_SEQ}
                  caughtCount={s2mCaught}
                  sectionLabel="Male sequence (fixed allocation)"
                />
              </div>
            </div>

            {/* Female tank section */}
            <div style={{ background: C.card, border: `2px solid ${C.female}30`, borderRadius: 8, padding: 14, marginBottom: 14 }}>
              <div style={{ fontWeight: 700, fontSize: '0.9rem', color: C.femTxt, marginBottom: 10 }}>
                ♀ Female Tank — {10 - s2fCaught} remaining
              </div>
              <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start', flexWrap: 'wrap' }}>
                <Tank remaining={10 - s2fCaught} total={10} fishColor={C.female} label="Female Tank" />
                <SeqGrid
                  catchOrder={FEM_CATCH_ORDER}
                  sequence={FEM_SEQ}
                  caughtCount={s2fCaught}
                  sectionLabel="Female sequence (fixed allocation)"
                />
              </div>
            </div>

            {/* Catch buttons */}
            {!s2allCaught && (
              <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
                <Btn
                  label="Catch Next Male"
                  variant="action"
                  disabled={s2mCaught >= 10}
                  onClick={() => setS2mCaught(n => Math.min(10, n + 1))}
                />
                <Btn
                  label="Catch Next Female"
                  variant="action"
                  disabled={s2fCaught >= 10}
                  onClick={() => setS2fCaught(n => Math.min(10, n + 1))}
                />
                <Btn
                  label="Catch All Remaining"
                  variant="secondary"
                  onClick={() => { setS2mCaught(10); setS2fCaught(10); }}
                />
              </div>
            )}

            {/* Show Results button */}
            {s2allCaught && !s2results && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ background: '#F0FDF4', border: '1px solid #86EFAC', borderRadius: 8, padding: '10px 14px', fontSize: '0.9rem', color: '#166534', marginBottom: 12 }}>
                  ✓ Assignment complete
                </div>
                <Btn label="View Study Results" variant="primary" onClick={() => setS2results(true)} />
              </div>
            )}

            {/* Results: two per-sex strip charts + interpretation */}
            {s2results && (
              <>
                <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '16px 16px 8px', marginBottom: 16 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <div style={{ display: 'flex', gap: 8, flex: 1, flexWrap: 'wrap' }}>
                      <div style={{ flex: 1, minWidth: 200 }}>
                        <StripChart
                          trt={STRAT_MALE_TRT}
                          ctl={STRAT_MALE_CTL}
                          hideSexCounts
                          hideLegend
                          svgMaxWidth={340}
                        />
                      </div>
                      <div style={{ flex: 1, minWidth: 200 }}>
                        <StripChart
                          trt={STRAT_FEM_TRT}
                          ctl={STRAT_FEM_CTL}
                          hideSexCounts
                          hideLegend
                          svgMaxWidth={340}
                        />
                      </div>
                    </div>
                    {/* Shared legend */}
                    <div style={{ paddingLeft: 8, flexShrink: 0, minWidth: 80 }}>
                      <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.72rem', fontWeight: 700, color: C.gray, marginBottom: 5 }}>Sex</div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 5 }}>
                        <svg width="14" height="14"><circle cx="7" cy="7" r="5.5" fill={C.male} /></svg>
                        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.75rem', color: C.dark }}>Male</span>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                        <svg width="14" height="14"><circle cx="7" cy="7" r="5.5" fill="none" stroke={C.female} strokeWidth="2" /></svg>
                        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: '0.75rem', color: C.dark }}>Female</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Interpretation summary */}
                <div style={{ background: '#F0FDF4', border: '1px solid #86EFAC', borderRadius: 8, padding: 16, marginBottom: 16 }}>
                  <div style={{ fontWeight: 700, fontSize: '1.1rem', color: C.black, marginBottom: 12 }}>
                    What happened?
                  </div>
                  <p style={{ margin: '0 0 10px', fontSize: '1rem', fontWeight: 500, color: C.dark, lineHeight: 1.5 }}>
                    <strong>The effect was present in both sexes at different magnitudes.</strong> With each stratum balanced, a consistent treatment effect is visible within males and within females separately. The apparent null result using simple randomization was driven by the sex imbalance, not by an absence of effect.
                  </p>
                  <p style={{ margin: '0 0 10px', fontSize: '1rem', fontWeight: 500, color: C.dark, lineHeight: 1.5 }}>
                    <strong>Fixed allocation within strata.</strong> We assigned 5 fish per stratum (male or female) to each group. This is stronger than simple randomization as it prevents the possibility of a by-chance imbalance of an important group characteristic.
                  </p>
                  <p style={{ margin: 0, fontSize: '1rem', fontWeight: 500, color: C.dark, lineHeight: 1.5 }}>
                    <strong>A note on stratified analysis.</strong> Stratified randomization of group assignment is distinct from stratifying during statistical analysis (e.g., separating sex as a covariate). Stratification during group assignment controls what you know before data collection, whereas stratification during analysis is an adjustment that corrects for what you measure after. In most experimental designs, both are appropriate and complementary.
                  </p>
                </div>
              </>
            )}
          </div>
        )}

        {/* ── SCREEN 3: Multi-variable Stratification Explorer ──────────── */}
        {screen === 3 && (
          <div>
            <InstructionCard title="Adding More Stratification Variables">
              Sex isn't the only variable that could influence aggression. Toggle variables below to define strata on multiple factors simultaneously. Fish will be pre-sorted by each stratum before allocation.
              <ul style={{ margin: '8px 0 0', paddingLeft: 20, lineHeight: 1.8 }}>
                <li><strong>Sex:</strong> Male vs. Female (sex specific aggression behaviors)</li>
                <li><strong>Speed:</strong> Fast vs. Slow (activity level)</li>
                <li><strong>Family:</strong> Four family lineages (genetic background)</li>
                <li><strong>Size:</strong> Large vs. Small (establishing dominance)</li>
              </ul>
            </InstructionCard>

            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: 16, marginBottom: 16 }}>
              {/* Variable toggles — order: sex, speed, family, size */}
              <div style={{ fontWeight: 700, fontSize: '1rem', color: C.black, marginBottom: 10 }}>
                Stratification variables:
              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 16 }}>
                {[
                  { key: 'sex',    label: 'Sex',    desc: 'Male vs. Female' },
                  { key: 'speed',  label: 'Speed',  desc: 'Fast vs. Slow'   },
                  { key: 'family', label: 'Family', desc: 'A · B · C · D'   },
                  { key: 'size',   label: 'Size',   desc: 'Large vs. Small' },
                ].map(({ key, label, desc }) => (
                  <button
                    key={key}
                    onClick={() => !exSub && setExVars(v => ({ ...v, [key]: !v[key] }))}
                    style={{
                      background:   exVars[key] ? C.accent + '22' : C.pageBg,
                      border:       `2px solid ${exVars[key] ? C.accent : C.border}`,
                      borderRadius: 8, padding: '8px 14px',
                      cursor: exSub ? 'default' : 'pointer',
                      textAlign: 'left', transition: 'all 0.15s',
                    }}
                  >
                    <span style={{ fontWeight: 700, color: exVars[key] ? C.accent : C.dark, fontSize: '0.9rem', display: 'block' }}>
                      {label} {exVars[key] ? '✓' : '○'}
                    </span>
                    <span style={{ fontSize: '0.7rem', color: C.gray }}>{desc}</span>
                  </button>
                ))}
              </div>

              {/* Strata display */}
              {strata.length === 0 ? (
                <div style={{ textAlign: 'center', color: C.gray, fontSize: '0.9rem', fontStyle: 'italic', padding: 16 }}>
                  Select at least one variable to define strata.
                </div>
              ) : (
                <>
                  {/* Summary badges */}
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 14 }}>
                    <Badge text={`${strata.length} ${strata.length === 1 ? 'stratum' : 'strata'}`} type={strata.length > 8 ? 'warning' : 'info'} />
                    {emptyCount > 0 && <Badge text={`${emptyCount} empty (0 fish)`} type="error" />}
                    {probCount  > 0 && <Badge text={`${probCount} with only 1 fish`} type="error" />}
                    {oddCount   > 0 && <Badge text={`${oddCount} with odd count`} type="warning" />}
                    {emptyCount === 0 && probCount === 0 && oddCount === 0 && (
                      <Badge text="✓ All strata can be perfectly balanced" type="success" />
                    )}
                  </div>

                  {/* Strata tanks grid */}
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 12 }}>
                    {strata.map(({ label, fish }) => (
                      <StratumTank key={label} label={label} fish={fish} />
                    ))}
                  </div>
                </>
              )}
            </div>

            {/* Reflection — single question */}
            <InstructionCard accent={C.accent} bg="#F5F0FF" title="Reflection">
              What are the trade-offs of stratifying on more versus fewer variables?
            </InstructionCard>
            <TextArea
              value={exQ} onChange={setExQ} disabled={exSub}
              placeholder="Consider both the practical and inferential consequences of adding more stratification variables..."
            />
            <div style={{ display: 'flex', justifyContent: 'flex-end', alignItems: 'center', marginTop: 8, gap: 8 }}>
              {exSub && (
                <div style={{ flex: 1, background: '#F0FDF4', border: '1px solid #86EFAC', borderRadius: 8, padding: '8px 12px', fontSize: '0.9rem', color: '#166534' }}>
                  Response saved. Click NEXT to continue.
                </div>
              )}
              <Btn label="Submit Response" variant="primary" disabled={exSub || exQ.trim().length < 1} onClick={() => setExSub(true)} />
            </div>
          </div>
        )}

        {/* ── SCREEN 4: Summary ────────────────────────────────────────── */}
        {screen === 4 && (
          <div>
            <InstructionCard title="Key Takeaways">
              <p style={{ margin: '0 0 12px' }}>
                <strong>Simple randomization</strong> assigns subjects to groups without accounting for known subgroups. In small samples, this can produce accidental imbalances, such as an uneven sex distribution that produces differences that mask a real treatment effect.
              </p>
              <p style={{ margin: '0 0 12px' }}>
                <strong>Stratified randomization with fixed allocation</strong> prevents this by first dividing subjects into strata based on relevant variables, then assigning from each stratum evenly to each group.
              </p>
              <p style={{ margin: 0 }}>
                <strong>More strata is not always better.</strong> Each additional variable multiplies the number of subgroups. With a small sample, many strata end up with too few subjects, or none at all, to balance. Prioritize the variables most likely to confound your outcome.
              </p>
            </InstructionCard>

            {/* Saved response */}
            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: 16, marginBottom: 16 }}>
              <div style={{ fontWeight: 700, fontSize: '1rem', color: C.black, marginBottom: 12 }}>Your Response</div>
              <ResponseDisplay
                prompt="What are the trade-offs of stratifying on more vs. fewer variables?"
                text={exQ}
              />
            </div>

            {/* TODO: DEV - Replace with shared GroupResponseFeed component */}
            {/* TODO: DEV - Connect to group session backend for peer responses */}
            <div style={{ background: C.card, border: `2px dashed ${C.border}`, borderRadius: 8, padding: 16, marginBottom: 16, opacity: 0.6 }}>
              <div style={{ fontWeight: 700, fontSize: '1rem', color: C.gray, marginBottom: 8 }}>Group Responses</div>
              <div style={{ fontSize: '0.85rem', color: C.mid, fontStyle: 'italic' }}>
                Peer responses from your cohort will appear here once connected to the group session backend.
              </div>
            </div>
          </div>
        )}

      </div>

      <NavBar
        screen={screen} total={TOTAL}
        canGoNext={canGoNext} onNext={goNext} onPrev={goPrev}
        showPrev={screen > 1}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

  </script>
</body>
</html>
